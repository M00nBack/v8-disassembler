name: Build V8 Disassembler

on:
  workflow_dispatch:
    inputs:
      v8_branch:
        description: 'V8 Version / Branch / Tag'
        required: true
        default: '12.4.254.21'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    env:
      V8_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.v8_branch || '12.4.254.21' }}
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows 11 SDK (10.0.22621.0)
        run: choco install windows-sdk-11-version-22H2-all -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Detect installed Windows SDK
        shell: pwsh
        run: |
          $includeRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          Get-ChildItem -Path $includeRoot -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem -Path $includeRoot -Directory | ForEach-Object {
            $ver = $_.Name
            $umPath = Join-Path $_.FullName "um"
            [PSCustomObject]@{
              Version = $ver
              UmExists = Test-Path $umPath
              UmPath = $umPath
            }
          } | Format-Table -AutoSize
          $sdkVersion = Get-ChildItem -Path $includeRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "um") } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name

          "Selected SDK: $sdkVersion"
          "UM path: $(Join-Path $includeRoot "$sdkVersion\um")"

      - name: Install depot_tools
        shell: pwsh
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append


      - name: Fetch V8 and checkout target version
        shell: pwsh
        run: |
          fetch v8
          cd v8
          git checkout 10.2.154.26
          gclient sync -v


      - name: Apply V8 patch
        shell: pwsh
        run: |
          Copy-Item -Path "patch\*" -Destination "v8\" -Recurse -Force
          cd v8
          python apply_patch.py --patch patch_old_v3.diff --verbose --second-try-ignore-whitespace --report apply_patch_report.txt


      - name: Build D8
        id: build
        shell: pwsh
        run: |
          cd v8
          $release = "out.gn\x64.release"
          New-Item -ItemType Directory -Path $release -Force
          Set-Content -Path "$release\args.gn" -Value @"
          dcheck_always_on = false
          is_component_build = false
          is_debug = false
          is_cfi = false
          target_cpu = "x64"
          use_custom_libcxx = false
          v8_monolithic = true
          v8_use_external_startup_data = false
          
          v8_static_library = true
          v8_enable_disassembler = true
          v8_enable_object_print = true
          v8_enable_sandbox = false
          v8_enable_pointer_compression = false
          v8_enable_pointer_compression_shared_cage = false
          v8_enable_shared_ro_heap = true
          v8_enable_webassembly = true
          
          v8_enable_handle_zapping = false
          v8_enable_31bit_smis_on_64bit_arch = false
          v8_enable_hugepage = false
          v8_enable_fast_mksnapshot = false
          v8_win64_unwinding_info = true
          v8_enable_map_packing = false
          v8_enable_v8_checks = false
          v8_enable_zone_compression = false
          v8_use_perfetto = false
          v8_enable_external_code_space = false
          v8_enable_i18n_support = true
          v8_enable_lite_mode = false
          v8_optimized_debug = true
          v8_use_siphash = true
          
          v8_enable_gdbjit = false
          v8_enable_javascript_promise_hooks = true
          v8_enable_short_builtin_calls = true
          v8_enable_wasm_simd256_revec = true
          v8_random_seed = true
          v8_trace_maps = false
          v8_enable_extensible_ro_snapshot = false
          v8_promise_internal_field_count = 1
          v8_enable_inspector = false
          
          treat_warnings_as_errors = false
          "@
          gn gen $release
          ninja -C $release d8
          $artifact = "d8-with-disassembler-$env:V8_BRANCH"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact=$artifact"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: v8/out.gn/x64.release/d8.exe